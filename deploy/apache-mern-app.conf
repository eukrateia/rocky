<VirtualHost *:80>
    ServerName yourdomain.com

    DocumentRoot /var/www/mern-app

    <Directory /var/www/mern-app>
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    ErrorLog ${APACHE_LOG_DIR}/mern-app-error.log
    CustomLog ${APACHE_LOG_DIR}/mern-app-access.log combined
</VirtualHost>
